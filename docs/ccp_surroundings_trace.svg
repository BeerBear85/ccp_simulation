<text x="44" y="938" class="small">Lower edge = documentation cut, not a closing shore.</text>
<text x="44" y="963" class="small">Building mass and bank strips are contextual symbols, not traced footprints.</text>
<g transform="translate(730 170)">
<text class="sub">1 / Dam and passage</text><text y="32" class="body">Raised crossing; water on both sides.</text><text y="58" class="body">Orange ring locates the opening.</text><text y="84" class="body">Opening interior and dimensions unknown.</text>
<text y="145" class="sub">2 / Opposite bank and tanks</text><text y="177" class="body">Curved bank with an inward projection.</text><text y="203" class="body">9920 shows stone slope and bank stairs;</text><text y="229" class="body">white tanks rise behind the crest.</text><text y="255" class="small">Stairs are not located on this trace.</text>
<text y="290" class="sub">3 / Jetties and cable</text><text y="322" class="body">White = visible jetties / obstacle marks.</text><text y="348" class="body">Dashed amber = prior cable geometry</text><text y="374" class="body">approximately registered to this view.</text><text y="400" class="body">The jetties do not close the water.</text>
<text y="461" class="sub">4 / Water texture is not terrain</text><text y="493" class="body">Pale bands may be shallow sediment</text><text y="519" class="body">or vegetation. They are not confirmed</text><text y="545" class="body">islands or dry banks.</text>
<text y="606" class="sub">Use for a 3D blockout</text><text y="638" class="body">Preserve the bends and connections.</text><text y="664" class="body">Use the JSON for editable source traces.</text><text y="690" class="body">World coordinates are provisional;</text><text y="716" class="body">heights and depths remain unset.</text>
</g></svg>
